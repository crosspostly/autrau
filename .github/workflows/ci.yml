name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all Python files
        run: |
          python -m compileall -q providers tools server.py
      - name: Parse JSON files
        run: |
          for f in $(find . -name "*.json" -not -path "./data/*"); do python -c "import json; json.load(open('$f'))"; done
